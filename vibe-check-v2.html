<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Check</title>
<!--
  VIBE CHECK 3 — 5th Grade Digital Wellness (Farmington Public Schools)
  Goals: (1) Communicate feelings and opinions in positive, effective ways.
         (2) Respond to negativity online in constructive and kind ways.

  This one file has EVERYTHING built in (photos included). Nothing loads from the internet,
  so school filters can't block it and it works offline.

  TEACHER SETUP: paste the PRE-FILLED LINK from VibePlanForm-setup.gs into FORM_PREFILL_LINK below.
  Photos: Unsplash (free license, unsplash.com/license).
-->
<style>
  :root{
    --bg:#ece9f7; --ink:#16181f; --muted:#6b7080; --line:#ececf2; --soft:#f5f5fa;
    --brand:#6d4aff; --brand2:#ff4fa3; --brand3:#ffb03a;
    --grad:linear-gradient(120deg,#6d4aff,#c44bff 45%,#ff4fa3 75%,#ffb03a);
    --best:#16a34a; --good:#0d9488; --ok:#ca8a04; --meh:#7b8190; --risky:#ea580c; --hurt:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);
    background:var(--bg); background-image:radial-gradient(circle at 15% 10%,#ffd9ef 0,transparent 40%),radial-gradient(circle at 85% 90%,#d6e9ff 0,transparent 45%),radial-gradient(circle at 80% 15%,#fff1cf 0,transparent 30%);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:12px}
  .phone{height:min(780px, calc(100vh - 24px)); aspect-ratio:9/18.6; max-width:100%; background:#101016; border-radius:42px; padding:10px; box-shadow:0 30px 70px rgba(40,20,90,.35), inset 0 0 0 2px #2a2a33}
  .screen{height:100%; background:#fff; border-radius:33px; overflow:hidden; display:flex; flex-direction:column; position:relative}
  @media (max-width:440px){ body{padding:0} .phone{height:100vh; height:100dvh; width:100%; aspect-ratio:auto; border-radius:0; padding:0} .screen{border-radius:0} }

  .statusbar{flex-shrink:0; height:30px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:.78rem; font-weight:700}
  .statusbar .bat{display:inline-block; width:22px; height:11px; border:1.5px solid var(--ink); border-radius:3px; position:relative; vertical-align:middle; margin-left:4px}
  .statusbar .bat::after{content:""; position:absolute; inset:1.5px; right:5px; background:var(--ink); border-radius:1px}
  .appbar{flex-shrink:0; display:flex; align-items:center; gap:8px; padding:4px 14px 8px; border-bottom:1px solid var(--line)}
  .logo{font-weight:900; font-size:1.3rem; letter-spacing:-.8px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-style:italic}
  .streak{margin-left:auto; font-size:.74rem; font-weight:800; background:#fff3e6; color:#c2410c; padding:3px 8px; border-radius:999px; transition:transform .25s}
  .streak.bump{transform:scale(1.25)}
  .vibe-pill{display:flex; align-items:center; gap:5px; font-size:.74rem; font-weight:800; color:var(--brand); background:#f1edff; padding:3px 8px; border-radius:999px}
  .vibe-pill .mini{width:42px; height:6px; background:#ddd6ff; border-radius:3px; overflow:hidden}
  .vibe-pill .mini i{display:block; height:100%; background:linear-gradient(90deg,#f97316,#facc15,#22c55e); transition:width .5s}
  .strip{flex-shrink:0; display:flex; align-items:center; gap:8px; padding:6px 14px; background:#fafafe; border-bottom:1px solid var(--line)}
  .strip .lbl{font-size:.66rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; white-space:nowrap}
  .dots{display:flex; gap:4px; margin-left:auto}
  .dots i{width:16px; height:5px; border-radius:3px; background:#e3e1ee}
  .dots i.done{background:var(--brand)} .dots i.now{background:var(--brand2)}

  .feed{flex:1; overflow-y:auto; scroll-behavior:smooth; background:#fff}
  .feed::-webkit-scrollbar{width:0}
  .bottomnav{flex-shrink:0; height:48px; border-top:1px solid var(--line); display:flex; justify-content:space-around; align-items:center; background:#fff}
  .bottomnav svg{width:24px; height:24px; stroke:var(--ink); fill:none; stroke-width:1.9}
  .bottomnav .me{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.9rem; box-shadow:0 0 0 2px var(--ink)}
  [hidden]{display:none!important}

  .pad{padding:16px}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.4); opacity:0} to{transform:scale(1); opacity:1}}
  h1,h2,h3{margin:0}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .card{background:#fff; border-radius:18px; padding:14px; box-shadow:0 3px 14px rgba(40,30,90,.08); margin-bottom:12px; border:1px solid #f0eef8}
  .btn{font:inherit; border:none; cursor:pointer; border-radius:999px; padding:13px 22px; font-weight:800; font-size:.96rem; background:var(--grad); background-size:150% 100%; color:#fff; box-shadow:0 8px 18px rgba(109,74,255,.3); transition:transform .15s, background-position .4s; display:inline-block; text-decoration:none; text-align:center}
  .btn:hover{transform:translateY(-2px); background-position:100% 0}
  .btn.block{width:100%}
  .btn.ghost{background:#fff; color:var(--brand); border:2px solid #ddd5ff; box-shadow:none}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
  .btn-row{display:flex; gap:8px} .btn-row .btn{flex:1; padding:12px 8px}
  :focus-visible{outline:3px solid #f59e0b; outline-offset:2px}

  /* Avatars */
  .av{width:34px; height:34px; border-radius:50%; color:#fff; font-weight:800; font-size:.74rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative}
  .av.ring{box-shadow:0 0 0 2px #fff, 0 0 0 4px #ff4fa3}
  .av.sm{width:28px; height:28px; font-size:.62rem}
  .av.emo{font-size:1.05rem}
  .av.sm.emo{font-size:.9rem}

  /* Post */
  .post{background:#fff}
  .post-head{display:flex; align-items:center; gap:10px; padding:10px 12px}
  .handle{font-weight:800; font-size:.86rem}
  .sub{font-size:.7rem; color:var(--muted)}
  .photo{aspect-ratio:1/1; width:100%; position:relative; overflow:hidden; background:#eee}
  .photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .bigheart{position:absolute; left:50%; top:50%; width:110px; height:110px; margin:-55px 0 0 -55px; z-index:3; pointer-events:none; animation:heart 1s ease forwards; filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
  @keyframes heart{0%{transform:scale(0); opacity:0} 25%{transform:scale(1.2); opacity:1} 45%{transform:scale(.95)} 70%{transform:scale(1); opacity:1} 100%{transform:scale(1.1) translateY(-30px); opacity:0}}
  .actions{display:flex; gap:15px; padding:9px 12px 4px; align-items:center}
  .actions svg{width:24px; height:24px; stroke:var(--ink); fill:none; stroke-width:1.8; transition:transform .2s}
  .actions svg.liked{fill:#ff3b5c; stroke:#ff3b5c; transform:scale(1.15)}
  .actions .save{margin-left:auto}
  .likes{font-size:.82rem; font-weight:800; padding:0 12px}
  .caption{font-size:.87rem; line-height:1.4; padding:3px 12px 8px}
  .caption b{margin-right:5px}

  .goal{margin:6px 12px 10px; border-radius:16px; padding:2px; background:var(--grad)}
  .goal > div{background:#fff; border-radius:14px; padding:10px 12px}
  .goal .k{font-size:.64rem; font-weight:900; letter-spacing:.7px; text-transform:uppercase; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
  .goal .v{font-size:.98rem; font-weight:800; line-height:1.3; margin-top:2px}
  .goal .hint{font-size:.76rem; color:var(--muted); margin-top:4px; line-height:1.35}

  .options{display:flex; flex-direction:column; gap:8px; padding:0 12px 16px}
  .opt{font:inherit; text-align:left; background:#fff; border:2px solid #e8e6f2; border-radius:14px; padding:11px 12px; font-size:.87rem; line-height:1.35; cursor:pointer; transition:all .15s; color:var(--ink); width:100%; display:flex; gap:10px; align-items:center}
  .opt:hover:not(:disabled){border-color:var(--brand); background:#f7f5ff; transform:translateY(-1px)}
  .opt:disabled{opacity:.45; cursor:default}
  .opt.picked{opacity:1; border-color:var(--brand); background:#f1edff}
  .opt .letter{flex-shrink:0; width:24px; height:24px; border-radius:50%; background:#f1edff; color:var(--brand); font-weight:900; font-size:.75rem; display:flex; align-items:center; justify-content:center}
  .opt .kind{display:block; font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:2px}
  .section-label{font-size:.66rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; padding:8px 12px 2px}

  /* Thread */
  .thread{padding:6px 12px; display:flex; flex-direction:column; gap:8px}
  .msg{display:flex; gap:8px; align-items:flex-start}
  .bubble{background:var(--soft); border-radius:16px; padding:7px 11px; font-size:.84rem; line-height:1.35; max-width:86%}
  .bubble b{font-size:.73rem; display:block; margin-bottom:1px}
  .msg.me .bubble{background:#ece6ff}
  .msg.mean .bubble{background:#fff0f0}
  .msg.dm .bubble{background:#e9f9f2}
  .dm-label{font-size:.6rem; font-weight:800; color:#0f766e; text-transform:uppercase; letter-spacing:.4px}
  .sys{font-size:.76rem; color:var(--muted); text-align:center; font-style:italic; padding:2px 6px}
  .typing{display:inline-flex; gap:3px; padding:10px 12px}
  .typing span{width:6px; height:6px; border-radius:50%; background:#b5b5c5; animation:blink 1s infinite}
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.3} 50%{opacity:1}}

  /* Undo bar */
  .undo{position:absolute; left:12px; right:12px; bottom:60px; z-index:30; background:#16181f; color:#fff; border-radius:16px; padding:10px 12px; box-shadow:0 10px 30px rgba(0,0,0,.35); animation:fade .25s ease}
  .undo-row{display:flex; align-items:center; gap:10px; font-size:.84rem; font-weight:700}
  .undo button{margin-left:auto; font:inherit; font-weight:900; background:#fff; color:#16181f; border:none; border-radius:999px; padding:7px 16px; cursor:pointer}
  .undo .bar{height:4px; background:#3a3c48; border-radius:2px; margin-top:8px; overflow:hidden}
  .undo .bar i{display:block; height:100%; width:100%; background:var(--grad); transform-origin:left; animation:shrink 3s linear forwards}
  @keyframes shrink{to{transform:scaleX(0)}}

  /* Feedback */
  .feedback{margin:6px 12px 20px; background:#fff; border-radius:18px; padding:14px; box-shadow:0 6px 24px rgba(40,30,90,.13); border-top:6px solid var(--brand)}
  .fb-title{font-size:1.1rem; font-weight:900; margin-bottom:8px}
  .chip-tag{display:inline-block; font-size:.78rem; font-weight:800; color:#fff; padding:4px 10px; border-radius:999px}
  .move-banner{display:flex; align-items:center; gap:10px; border-radius:14px; padding:10px; margin-bottom:8px}
  .move-banner .k{font-size:.62rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase; opacity:.8}
  .move-banner .v{font-size:1.2rem; font-weight:900}
  .move-banner .e{font-size:2.1rem}
  .feel{display:flex; align-items:center; gap:8px; font-size:.83rem; background:var(--soft); border-radius:12px; padding:7px 10px; margin:8px 0}
  .feel span{font-size:1.5rem}
  .why{font-size:.86rem; line-height:1.5; margin:8px 0}
  .stronger{font-size:.83rem; background:#effaf3; border:1px solid #c8eed6; border-radius:12px; padding:8px 10px; margin:8px 0; line-height:1.45}
  details.all{margin:6px 0 12px; font-size:.8rem}
  details.all summary{cursor:pointer; color:var(--brand); font-weight:700}
  .all-row{display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid #f0f0f5; line-height:1.35}
  .all-row:last-child{border-bottom:none}
  .all-row .chip-tag{font-size:.64rem; padding:2px 7px; flex-shrink:0}

  /* Toasts (phone notifications) */
  .toasts{position:absolute; top:34px; left:10px; right:10px; z-index:50; display:flex; flex-direction:column; gap:6px; pointer-events:none}
  .toast{background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-radius:16px; padding:9px 11px; box-shadow:0 10px 28px rgba(20,10,60,.22); display:flex; gap:9px; align-items:center; font-size:.8rem; line-height:1.3; animation:tin .35s cubic-bezier(.2,1.3,.4,1), tout .35s ease 2.6s forwards}
  .toast .ic{width:28px; height:28px; border-radius:8px; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.8rem; flex-shrink:0}
  .toast small{display:block; color:var(--muted); font-size:.66rem; font-weight:700}
  @keyframes tin{from{transform:translateY(-120%); opacity:0}}
  @keyframes tout{to{transform:translateY(-120%); opacity:0}}

  /* Primer */
  .move-group{border-radius:14px; padding:9px 11px; margin-bottom:8px}
  .move-group h4{margin:0 0 4px; font-size:.8rem}
  .move-line{font-size:.78rem; line-height:1.45}

  /* Rewrite */
  .ctx{display:flex; gap:10px; align-items:center; background:var(--soft); border-radius:14px; padding:8px; margin-bottom:10px}
  .ctx img{width:64px; height:64px; border-radius:10px; object-fit:cover; flex-shrink:0}
  .ctx .t{font-size:.8rem; line-height:1.35}
  .mean-box{background:#fff0f0; border:2px dashed #fca5a5; border-radius:14px; padding:10px 12px; font-size:.92rem; margin:6px 0 10px; position:relative}
  .mean-box .x{position:absolute; top:-9px; left:10px; font-size:.6rem; font-weight:900; background:#dc2626; color:#fff; padding:2px 7px; border-radius:999px; letter-spacing:.4px}
  textarea{width:100%; font:inherit; font-size:.93rem; border:2px solid #e3e0f0; border-radius:14px; padding:10px 12px; resize:none; min-height:80px; background:#fff; color:var(--ink)}
  textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(109,74,255,.15)}
  textarea:disabled{background:#f5f5fa}
  .count{font-size:.68rem; color:var(--muted); text-align:right; margin-top:2px}
  .checks{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0 10px}
  .check{display:flex; gap:6px; align-items:center; font-size:.78rem; background:#fff; border-radius:12px; padding:7px 8px; cursor:pointer; border:2px solid #ebe9f4}
  .check input{width:16px; height:16px; accent-color:var(--brand); flex-shrink:0}
  .check.on{border-color:#cfc4ff; background:#f4f0ff}
  .stop{background:#fef2f2; border:2px solid #fca5a5; color:#7f1d1d; border-radius:14px; padding:10px 12px; font-size:.84rem; margin:8px 0; line-height:1.45}
  .stop mark{background:#fecaca; color:#7f1d1d; border-radius:4px; padding:0 3px; font-weight:800}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)}}
  .crit{display:flex; gap:8px; align-items:flex-start; font-size:.83rem; line-height:1.4; padding:7px 0; border-bottom:1px solid #f0f0f5}
  .crit:last-child{border-bottom:none}
  .crit .ic{font-size:1rem; flex-shrink:0; width:20px; text-align:center}
  .crit q{font-weight:700; color:var(--brand)}
  .label{font-size:.68rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; display:block}

  /* Profile create */
  .namepick{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0}
  .namepick button, .avpick button{font:inherit; cursor:pointer; border:2px solid #e8e6f2; background:#fff; border-radius:12px; padding:9px 6px; font-weight:700; font-size:.8rem; color:var(--ink)}
  .namepick button.on, .avpick button.on{border-color:var(--brand); background:#f1edff; color:var(--brand)}
  .avpick{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0}
  .avpick button{font-size:1.5rem; padding:6px}
  .preview{display:flex; align-items:center; gap:12px; justify-content:center; margin:6px 0 2px}
  .preview .av{width:60px; height:60px; font-size:1.9rem}

  /* Badge screen */
  .badge-big{width:130px; height:130px; border-radius:50%; margin:10px auto; display:flex; align-items:center; justify-content:center; font-size:4rem; position:relative}
  .badge-big.earned{background:conic-gradient(from 0deg,#6d4aff,#ff4fa3,#ffb03a,#6d4aff); animation:spin 6s linear infinite}
  .badge-big.earned > span{animation:spin 6s linear infinite reverse}
  .badge-big.locked{background:#e9e7f2; filter:grayscale(1)}
  .badge-big::after{content:""; position:absolute; inset:8px; border-radius:50%; background:#fff; z-index:0}
  .badge-big > span{position:relative; z-index:1}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Profile recap */
  .prof-head{display:flex; align-items:center; gap:16px; padding:16px}
  .prof-head .av{width:76px; height:76px; font-size:2.4rem}
  .prof-stats{display:flex; flex:1; justify-content:space-around; text-align:center}
  .prof-stats b{display:block; font-size:1.15rem}
  .prof-stats span{font-size:.68rem; color:var(--muted); font-weight:700}
  .badges{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:0 16px 12px}
  .badges div{text-align:center; font-size:.6rem; font-weight:700; color:var(--muted); line-height:1.2}
  .badges .b{width:48px; height:48px; border-radius:50%; margin:0 auto 4px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; background:#f1edff; box-shadow:0 0 0 2px #fff, 0 0 0 4px #c4b5fd}
  .badges .off .b{filter:grayscale(1); opacity:.35; box-shadow:none}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:2px}
  .grid3 img{width:100%; aspect-ratio:1; object-fit:cover; display:block}

  /* Plan */
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
  .chip{font:inherit; font-size:.76rem; border:2px solid #e3e0f0; background:#fff; border-radius:999px; padding:6px 10px; cursor:pointer; color:var(--ink)}
  .chip.on{border-color:var(--brand); background:#f1edff; color:var(--brand); font-weight:700}
  .radio-card{display:flex; gap:8px; align-items:flex-start; border:2px solid #e8e6f2; border-radius:14px; padding:9px 10px; margin-bottom:6px; cursor:pointer; font-size:.84rem; line-height:1.35}
  .radio-card input{margin-top:3px; accent-color:var(--brand)}
  .radio-card.on{border-color:var(--brand); background:#f7f5ff}
  .warn{background:#fef2f2; color:#991b1b; border:1px solid #fecaca; border-radius:12px; padding:9px 10px; font-size:.8rem; line-height:1.4}
  .tks{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px}
  .tks div{border-radius:14px; padding:10px 6px; text-align:center; font-size:.72rem; line-height:1.3; color:#fff; font-weight:600}
  .tks b{display:block; font-size:.92rem; margin:2px 0}
  .pill{display:inline-block; font-size:.68rem; font-weight:900; letter-spacing:.6px; color:#fff; background:var(--grad); padding:5px 12px; border-radius:999px}
  .confetti{position:absolute; top:-10px; width:8px; height:8px; border-radius:2px; z-index:60; pointer-events:none; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(900px) rotate(720deg); opacity:0}}
  .splash{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; background:var(--grad); color:#fff}
  .splash .icon{width:96px; height:96px; border-radius:28px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:3rem; box-shadow:0 14px 40px rgba(0,0,0,.25); animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
  .splash h1{font-size:2.3rem; font-style:italic; letter-spacing:-1px; margin-top:16px}
  .splash .btn{background:#fff; color:var(--brand); box-shadow:0 10px 24px rgba(0,0,0,.2)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="screen">
    <div class="statusbar"><span>9:41</span><span>5G<i class="bat"></i></span></div>
    <header class="appbar" id="appbar" hidden>
      <div class="logo">vibecheck</div>
      <div class="streak" id="streak" title="Strong-choice streak">🔥 0</div>
      <div class="vibe-pill" title="Community Vibe">✨ <span id="vibeNum">40</span><span class="mini"><i id="vibeFill" style="width:40%"></i></span></div>
    </header>
    <div class="strip" id="strip" hidden><span class="lbl" id="partTag"></span><div class="dots" id="dots"></div></div>
    <main class="feed" id="feed" aria-live="polite"></main>
    <nav class="bottomnav" id="bottomnav" hidden aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>

async function playThread(msgs, slot){
  const myRun = runId;
  for (const m of msgs){
    await wait(550); if (myRun !== runId) return false;
    if (!m.sys){
      slot.insertAdjacentHTML("beforeend", `<div class="msg" id="typing">${avatar(m.who, "sm")}<div class="bubble typing"><span></span><span></span><span></span></div></div>`);
      scrollToEl(slot.lastElementChild, "center");
      await wait(950);

    }

  await wait(800);
  return myRun === runId;
}

function findTerms(text, list){
  const t = " " + text.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ") + " ";
  return list.filter(w => t.includes(" " + w + " "));
}
function findEmoji(text, list){ return list.filter(e => text.includes(e)); }
/* Reads what the student wrote and returns specific feedback. Rule-based — no AI, nothing is sent anywhere. */
function checkMessage(text, r){
  const words = text.trim().split(/\s+/).filter(w => /[a-z]/i.test(w));
  const letters = text.replace(/[^A-Za-z]/g, "");
  const harsh = [...findTerms(text, HARSH), ...findEmoji(text, HARSH_EMOJI)];
  const caution = findTerms(text, CAUTION);
  const shouty = letters.length >= 8 && letters.replace(/[^A-Z]/g, "").length / letters.length > 0.7;
  const meanWords = r.mean.toLowerCase().match(/[a-z']{4,}/g) || [];
  const copied = meanWords.filter(w => text.toLowerCase().includes(w)).length / Math.max(1, meanWords.length) >= 0.6;
  const block = [];
  if (words.length < 4) block.push({ why: "short", msg: "That's too short to really say something. Write at least one full sentence (4+ words)." });
  if (harsh.length) block.push({ why: "harsh", msg: `Your message uses ${harsh.map(h => `<mark>${esc(h)}</mark>`).join(", ")}. ${harsh.length > 1 ? "Those words" : "That word"} can hurt — even if you don't mean it to.` });
  if (copied && !harsh.length) block.push({ why: "copy", msg: "Your message is still really close to the mean one. Try saying it a whole new way." });
  if (shouty) block.push({ why: "caps", msg: "ALL CAPS can look like yelling. Try regular letters." });

  const kind = [...findTerms(text, KIND), ...findEmoji(text, KIND_EMOJI)].sort((a, b) => b.length - a.length).filter((k, i, arr) => !arr.slice(0, i).some(x => x.includes(k)));
  const specific = r.opinion ? findTerms(text, OPINION) : findTerms(text, r.specific);
  const helpful = [...findTerms(text, HELPFUL), ...(text.includes("?") ? ["?"] : [])];
  const fake = r.opinion ? findTerms(text, FAKE_PRAISE) : [];
  const crit = [];
  if (r.opinion){
    crit.push(fake.length ? { ok: false, icon: "🎭", label: "True", msg: `You wrote <q>${esc(fake[0])}</q> — but you didn't like the game. It's OK to share your real opinion, kindly.` }
      : specific.length ? { ok: true, label: "True", msg: `You shared your own opinion with <q>${esc(specific[0])}</q>. Honest without being harsh.` }
      : { ok: false, icon: "➜", label: "True", msg: "Say how <b>you</b> felt with an \"I\" statement, like <q>It wasn't really my favorite</q>." });
  }
  crit.push(kind.length ? { ok: true, label: "Kind", msg: `You used <q>${esc(kind[0])}</q>${kind[1] ? ` and <q>${esc(kind[1])}</q>` : ""} — that sounds warm.` }
    : { ok: false, icon: "➜", label: "Kind", msg: "Add something warm or positive so the person knows you're on their side." });
  if (!r.opinion){
    crit.push(specific.length ? { ok: true, label: "Specific", msg: `You mentioned <q>${esc(specific[0])}</q> — that shows you really noticed.` }
      : { ok: false, icon: "➜", label: "Specific", msg: r.specificHint });
  }
  crit.push(helpful.length ? { ok: true, label: "Helpful", msg: helpful.includes("?") && helpful.length === 1 ? "You asked a question — that keeps the conversation friendly." : `<q>${esc(helpful.find(h => h !== "?"))}</q> offers an idea or help. Nice!` }
    : { ok: false, icon: "➜", label: "Helpful", msg: r.opinion ? "Add an idea, like offering to pick the next game." : "Try adding an idea, a question, or an offer to help." });
  if (caution.length) crit.push({ ok: false, icon: "⚠️", label: "Careful", msg: `<q>${esc(caution[0])}</q> can make a kind message sound like teasing.` });
  if (words.length < 7 && !block.length) crit.push({ ok: false, icon: "➜", label: "Say more", msg: "Short messages can feel cold. A few more words would help." });
  const core = crit.filter(c => ["True","Kind","Specific","Helpful"].includes(c.label));
  const met = core.filter(c => c.ok).length, missing = crit.filter(c => !c.ok).length;
  const level = missing === 0 ? "strong" : (met >= core.length - 1 && !fake.length) ? "good" : "almost";
  return { block, crit, level };
}
function postRewrite(i){
  const r = REWRITES[i], text = $("rw").value.trim(), res = checkMessage(text, r);
  if (res.block.length){
    const boxes = document.querySelectorAll("#checks input"), mismatch = [];
    if (res.block.some(b => b.why === "harsh" || b.why === "caps")) { mismatch.push("Kind", "Something I'd say face to face"); boxes[1].checked = false; boxes[3].checked = false; }
    if (res.block.some(b => b.why === "copy")) { mismatch.push("Kind"); boxes[1].checked = false; }
    if (res.block.some(b => b.why === "short")) { mismatch.push("Specific"); boxes[2].checked = false; }
    boxes.forEach(b => b.dispatchEvent(new Event("change")));
    const uniq = [...new Set(mismatch)];
    $("stopBox").innerHTML = `<div class="stop shake"><b>⏸️ Pause — this can't be posted yet.</b>
      ${uniq.length ? `<div style="margin-top:4px">You checked <b>${uniq.map(esc).join("</b> and <b>")}</b>, but…</div>` : ""}
      <ul style="margin:6px 0 0; padding-left:18px">${res.block.map(b => `<li>${b.msg}</li>`).join("")}</ul>

  }
  setVibe({ strong: 10, good: 6, almost: 2 }[res.level]); setStreak(res.level === "strong");
  S.rewrites[i] = { text, level: res.level };
  if (res.level === "strong"){ confetti(); toast("❤️", "vibecheck · now", `<b>${P[r.who].handle}</b> liked your message ❤️`); }
  else if (res.level === "good") toast("💬", "vibecheck · now", `<b>${P[r.who].handle}</b> replied: “thanks 🙂”`);
  $("rw").disabled = true; $("rwPost").disabled = true; $("rwHelp").hidden = true;

  $("fbSlot").innerHTML = `
    <section class="feedback fade" id="fb" style="border-top-color:${V[1]}">
      <div class="fb-title" style="color:${V[1]}">${V[0]}</div>
      <div class="feel"><span>${V[2]}</span><div>${esc(P[r.who].name)} might feel: <b>${V[3]}</b></div></div>
      <span class="label" style="margin-top:6px">Feedback on YOUR message</span>
      ${res.crit.map(c => `<div class="crit"><span class="ic">${c.ok ? "✔️" : c.icon}</span><div><b>${esc(c.label)}:</b> ${c.msg}</div></div>`).join("")}
      <div class="stronger" style="margin-top:10px">💬 <b>Another way to say it:</b><br>"${esc(r.example)}"</div>
      <div class="btn-row" style="margin-top:10px">
        ${res.level !== "strong" ? `<button class="btn ghost" onclick="reviseRewrite(${i})">✏️ Level it up</button>` : ""}
        <button class="btn" onclick="next()">Next ▶</button>
      </div>
    </section>`;
  scrollToEl($("fb"));
}

  const count = step.part === 1 ? S.history.filter(h => h.part === 1 && h.tier === "best").length + " of 4 strongest comments"
              : step.part === 2 ? S.history.filter(h => h.part === 2 && (h.tier === "best" || h.tier === "good")).length + " of 4 helpful moves"
              : S.rewrites.filter(r => r.level === "strong").length + " of 3 strong messages";
  if (got) confetti(60);
  f.innerHTML = `
    <div class="pad fade center" style="padding-top:26px">
      <span class="pill">PART ${step.part} COMPLETE</span>
      <div class="badge-big ${got ? "earned" : "locked"} pop"><span>${b.emoji}</span></div>
      <h2 style="font-size:1.4rem">${got ? "Badge unlocked!" : "So close!"}</h2>
      <div style="font-size:1.15rem; font-weight:900; margin:4px 0; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent">${b.name}</div>
      <p style="font-size:.88rem; margin:6px 0 4px">You got <b>${count}</b>.</p>
      <p class="muted" style="font-size:.8rem; margin:0 0 18px">${got ? "Keep that vibe going!" : `To earn it: ${b.need}. You can replay later to unlock it!`}</p>
      <div class="card" style="text-align:left; font-size:.82rem">✨ Community Vibe: <b>${S.vibe}</b> · 🔥 Best streak: <b>${S.bestStreak}</b></div>
      <button class="btn block" onclick="next()">${step.part === 3 ? "See my profile ▶" : "Keep going ▶"}</button>
    </div>`;
}

function renderRecap(step, f){
  setChrome("app", "Your profile");
  const strong = S.history.filter(h => h.tier === "best" || h.tier === "good").length;
  f.innerHTML = `
    <div class="fade">
      <div class="prof-head">
        <div class="av emo ring" style="background:${S.me.color}">${S.me.emoji}</div>
        <div class="prof-stats">
          <div><b>${S.vibe}</b><span>Vibe</span></div>
          <div><b>${strong}/${S.history.length}</b><span>Strong picks</span></div>
          <div><b>${S.bestStreak}</b><span>Best streak</span></div>
        </div>
      </div>
      <div style="padding:0 16px 12px"><b>@${esc(S.me.handle)}</b><div class="muted" style="font-size:.8rem">Vibe Check player · Grade 5</div></div>
      <div class="section-label" style="padding:0 16px 8px">Badges</div>
      <div class="badges">${BADGES.map(b => `<div class="${S.badges[b.id] ? "" : "off"}"><div class="b">${b.emoji}</div>${b.name}</div>`).join("")}</div>
      <div class="grid3">${["science","skate","drawing","soccer","castle","singer","pizza","turtle","ella"].map(k => `<img src="${IMG[k]}" alt="">`).join("")}</div>
      <div class="pad"><button class="btn block" onclick="next()">Make my Vibe Plan 📝</button></div>
    </div>`;
}

/* Vibe Plan */
function stickyRound(){ return S.history.find(h => h.tier === "hurt" || h.tier === "risky") || S.history.find(h => h.tier !== "best" && h.tier !== "good") || null; }
function strongCount(){ return S.history.filter(h => h.tier === "best" || h.tier === "good").length; }
function renderPlan(step, f){
  setChrome("app", "Final step · My Vibe Plan");
  const st = stickyRound(), LV = { strong: "🌟", good: "👍", almost: "🤔" };
  f.innerHTML = `
    <div class="pad fade">
      <div class="center" style="margin-bottom:10px"><div style="font-size:2.4rem">📝</div><h2 style="font-size:1.25rem">My Vibe Plan</h2>
        <p class="muted" style="font-size:.82rem; margin:4px 0 0">Finish your plan, then send it to your teacher.</p></div>
      <div class="card"><span class="label">1 · My best message</span>
        <div id="bestList">${S.rewrites.map((t, i) => `<label class="radio-card${i === S.plan.best ? " on" : ""}"><input type="radio" name="best" value="${i}" ${i === S.plan.best ? "checked" : ""}> <span>${LV[t.level]} "${esc(t.text)}"</span></label>`).join("")}</div></div>
      <div class="card"><span class="label">2 · When I see something mean online, I will…</span>
        <p style="font-size:.78rem; margin:0" class="muted">Tap one or more, then make it your own.</p>
        <div class="chips" id="chips">${PLAN_MOVES.map((m, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="false">${esc(m)}</button>`).join("")}</div>
        <textarea id="planText" maxlength="250" placeholder="When I see something mean online, I will…"></textarea></div>
      <div class="card"><span class="label">3 · My sticky round</span>
        ${st ? `<p style="font-size:.8rem; margin:0 0 6px">The round that made me think: <b>${esc(st.title)}</b></p>
          <div class="mean-box" style="border-style:solid; font-size:.8rem; margin:4px 0">I picked: "${esc(st.chose)}" <i>(${esc(st.chosenTag)})</i></div>
          <div class="stronger" style="margin:4px 0">A stronger choice: "${esc(st.best)}" <i>(${esc(st.bestTag)})</i></div>`
        : `<p style="font-size:.84rem; margin:0">🏆 You picked a strong move in every round!</p>`}</div>
      <div class="card"><label class="label" for="reflect">4 · One thing I learned today (optional)</label>
        <textarea id="reflect" maxlength="250" style="min-height:60px" placeholder="I learned that…"></textarea></div>
      <div id="planErr"></div>
      <button class="btn block" id="submitBtn" type="button">Submit my Vibe Plan 📨</button>
      <p class="muted center" style="font-size:.72rem; margin:8px 0 4px">Opens a Google Form with your answers filled in. Check it, then press <b>Submit</b>.</p>
    </div>`;
  document.querySelectorAll("#bestList input").forEach(r => r.addEventListener("change", () => {
    S.plan.best = +r.value;
    document.querySelectorAll("#bestList .radio-card").forEach(c => c.classList.toggle("on", c.querySelector("input").checked));
  }));
  const pt = $("planText");
  document.querySelectorAll("#chips .chip").forEach(c => c.addEventListener("click", () => {
    const m = PLAN_MOVES[+c.dataset.i], on = !c.classList.contains("on");
    c.classList.toggle("on", on); c.setAttribute("aria-pressed", on);
    S.plan.moves = on ? S.plan.moves.concat(m) : S.plan.moves.filter(x => x !== m);
    const list = S.plan.moves.map(x => x.charAt(0).toLowerCase() + x.slice(1));
    pt.value = list.length ? `When I see something mean online, I will ${joinList(list)}.` : "";
  }));
  $("submitBtn").addEventListener("click", submitPlan);
}
function joinList(a){ return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }
function planAnswers(){
  const st = stickyRound(), b = S.rewrites[S.plan.best];
  const badgeList = BADGES.filter(x => S.badges[x.id]).map(x => x.name).join(", ") || "none yet";
  return {
    BEST: b ? b.text : "",
    PLAN: $("planText").value.trim(),
    STICKY: st ? `${st.title} — I picked: "${st.chose}" (${st.chosenTag}). A stronger choice: "${st.best}" (${st.bestTag})` : "I picked a strong move in every round!",
    SUMMARY: `Username: @${S.me.handle}\nCommunity Vibe: ${S.vibe}/100 · Strong choices: ${strongCount()} of ${S.history.length} · Strong messages: ${S.rewrites.filter(r => r.level === "strong").length} of ${S.rewrites.length} · Best streak: ${S.bestStreak} · Undo used: ${S.undos}\nBadges: ${badgeList}\n` +
             S.history.map((h, i) => `${i + 1}. ${h.title}: ${h.chosenTag}`).join("\n") + "\n" +
             S.rewrites.map((r, i) => `Message ${i + 1} (${r.level}): ${r.text}`).join("\n"),
    REFLECT: $("reflect").value.trim()
  };
}
function buildFormUrl(ans){
  if (!FORM_PREFILL_LINK) return null;
  let u; try { u = new URL(FORM_PREFILL_LINK.trim()); } catch(e) { return null; }
  const out = new URL(u.origin + u.pathname);
  out.searchParams.set("usp", "pp_url");
  let mapped = 0;
  for (const [k, v] of u.searchParams){
    if (!k.startsWith("entry.")) continue;
    const token = v.trim().toUpperCase();
    if (token in ans){ out.searchParams.set(k, ans[token]); mapped++; }
  }
  return mapped ? out.toString() : null;
}
let _lastUrl = null;
/* Opening the form: try a new tab first. Some embeds (like Google Sites) block new tabs,
   so if that fails we show the form right inside the game instead. */
function openForm(url){
  let w = null;
  try { w = window.open(url, "_blank"); } catch(e) { w = null; }
  if (w){ try { w.opener = null; } catch(e) {} return true; }
  return false;
}
function submitPlan(e){
  e.preventDefault();
  const err = $("planErr");
  if ($("planText").value.trim().length < 10){
    err.innerHTML = `<div class="warn fade" style="margin-bottom:10px">✋ Finish #2 first: what will <b>you</b> do when you see something mean online?</div>`;
    scrollToEl($("planText").closest(".card")); $("planText").focus({ preventScroll: true });
    return;
  }
  err.innerHTML = "";
  const url = buildFormUrl(planAnswers());
  if (!url){
    err.innerHTML = `<div class="warn fade" style="margin-bottom:10px">⚠️ The Google Form isn't connected yet. Tell your teacher! (Teacher: paste the pre-filled link into <code>FORM_PREFILL_LINK</code>.)</div>`;
    return;
  }
  _lastUrl = url;
  if (openForm(url)) { setTimeout(next, 400); return; }
  showFormInline(url);
}
function showFormInline(url){
  const embed = url + (url.includes("?") ? "&" : "?") + "embedded=true";
  S.inlineForm = true;
  setChrome("app", "Final step · Submit your plan");
  const f = $("feed"); f.scrollTop = 0;
  f.innerHTML = `
    <div class="fade" style="padding:12px 12px 4px">
      <div class="card" style="margin-bottom:8px; font-size:.84rem; line-height:1.45">
        📨 <b>Your answers are already filled in below.</b><br>
        Check the <b>"Record my email"</b> box, scroll down, and press <b>Submit</b>.
      </div>
    </div>
    <iframe id="formFrame" src="${esc(embed)}" title="My Vibe Plan form" style="width:100%; height:560px; border:0; display:block; background:#fff"></iframe>
    <div class="pad" style="padding-top:10px">
      <button class="btn block" onclick="next()">I pressed Submit ✓</button>
      <p class="muted center" style="font-size:.74rem; margin:10px 0 0">Form not showing? <a href="${esc(url)}" target="_top" style="color:var(--brand); font-weight:700">Open the form here</a> (this leaves the game — your answers come with you).</p>
    </div>`;
}
function reopenForm(){ if (_lastUrl && !openForm(_lastUrl)) showFormInline(_lastUrl); }
function renderDone(step, f){
  setChrome("plain"); confetti(60);
  f.innerHTML = `
    <div class="splash">
      <div class="icon">🎉</div>
      <h1 style="font-size:1.8rem">Almost done!</h1>
      <p style="font-size:.92rem; line-height:1.5; margin:8px 0 14px">${S.inlineForm ? "Thanks for sending your Vibe Plan!" : "Your Vibe Plan opened in a new tab.<br><b>Press Submit on the Google Form.</b>"}</p>
      <div style="background:rgba(255,255,255,.18); border-radius:16px; padding:12px; font-size:.84rem; margin-bottom:14px">Did you see <i>"Your Vibe Plan was recorded"</i>?<br>If not, go back to that tab — or<br>
        <button class="btn" style="margin-top:8px; padding:8px 16px; font-size:.85rem" onclick="reopenForm()">Open my form again</button></div>
      <p style="font-size:.86rem; margin:0 0 16px">Before you post, ask:<br><b>Is it true? Is it kind? Is it specific?</b></p>
      <button class="btn" onclick="start(true)">Play again ↺</button>
    </div>`;
}

start();
</script>
</body>
</html>
